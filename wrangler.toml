name = 'org-webhook-spliter'
main = 'src/index.ts'
compatibility_date = '2025-09-27'

# https://developers.cloudflare.com/workers/wrangler/configuration/#source-of-truth
keep_vars = true

[observability]
enabled = true
logs = { enabled = true }

[placement]
mode = 'smart'

[vars]
SECRET = 'disabled'
ORG_CONFIG = '{}'
REPO_CONFIG = '{}'
HEADERS = '{}'
